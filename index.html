<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="google" content="notranslate" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <meta name="theme-color" content="#06162e" />
    <script>
      try {
        var savedTheme = localStorage.getItem('soda:theme');
        var initialTheme = savedTheme === 'dark' || savedTheme === 'light' ? savedTheme : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = initialTheme;
        document.querySelector('meta[name="theme-color"]').content = initialTheme === 'dark' ? '#06162e' : '#f6f8fb';
      } catch (_) { document.documentElement.dataset.theme = 'light'; }
    </script>
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="SODA" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/icons/soda-favicon-32.png"
    />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/soda-apple-180.png" />

    <title>SODA</title>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
